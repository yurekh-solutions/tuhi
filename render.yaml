services:
  - type: web
    name: tuhi-car-rental
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
